name: Compilar Maya Inkling Mini para Windows

on:
  push:
    branches: [master]
    paths: ['.github/workflows/maya-inkling-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CUDA_VERSION: '13.2.0'

    steps:
      - name: Descargar el código de Maya Inkling Mini
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: alesha-pro/maya-inkling-mini
          ref: c520fd14de3b21d67ddc6b7e7348b761aad26d52
          persist-credentials: false

      - name: Preparar CUDA y cuBLAS
        shell: pwsh
        run: |
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $manifest = Invoke-RestMethod "$base/redistrib_$env:CUDA_VERSION.json"
          $env:CUDA_ROOT = Join-Path $env:RUNNER_TEMP 'cuda-13.2'
          "CUDA_ROOT=$env:CUDA_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $env:CUDA_ROOT | Out-Null

          $components = 'cuda_nvcc', 'cuda_crt', 'cuda_cudart', 'cuda_cccl', 'libnvvm', 'libcublas'
          foreach ($component in $components) {
              $package = $manifest.$component.'windows-x86_64'
              $archive = Join-Path $env:RUNNER_TEMP "$component.zip"
              curl.exe --fail --location --silent --show-error --retry 3 "$base/$($package.relative_path)" --output $archive
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ((Get-FileHash -LiteralPath $archive).Hash -ne $package.sha256) {
                  throw "SHA-256 incorrecto en $component"
              }
              tar.exe -xf $archive -C $env:CUDA_ROOT --strip-components=1
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              Remove-Item -LiteralPath $archive
          }

          "$env:CUDA_ROOT\bin" >> $env:GITHUB_PATH
          & "$env:CUDA_ROOT\bin\nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar maya-ik2 para sm_86
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON -DSTRATA_BUILD_TESTS=OFF -DSTRATA_NATIVE_EXPERTS=OFF -DSTRATA_PORTABLE=ON -DCMAKE_CUDA_ARCHITECTURES=86 "-DCUDAToolkit_ROOT=%CUDA_ROOT%" "-DCMAKE_CUDA_COMPILER=%CUDA_ROOT%\bin\nvcc.exe" || exit /b 1
          cmake --build build --parallel 2 --target maya-ik2 || exit /b 1
          dumpbin /DEPENDENTS build\maya-ik2.exe || exit /b 1

      - name: Empaquetar el ejecutable y cuBLAS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -LiteralPath 'build\maya-ik2.exe', 'LICENSE' -Destination dist
          $libraries = 'cublas64_13.dll', 'cublasLt64_13.dll'
          foreach ($library in $libraries) {
              $files = @(Get-ChildItem -LiteralPath $env:CUDA_ROOT -Filter $library -File -Recurse)
              if ($files.Count -ne 1) { throw "No se encontró una copia de $library" }
              Copy-Item -LiteralPath $files[0].FullName -Destination dist
          }
          $notice = Get-ChildItem -LiteralPath $env:CUDA_ROOT -Filter 'LICENSE*' -File | Select-Object -First 1
          if (-not $notice) { throw 'No se encontró la licencia de NVIDIA' }
          Copy-Item -LiteralPath $notice.FullName -Destination 'dist\LICENSE-NVIDIA.txt'
          Get-FileHash -LiteralPath 'dist\maya-ik2.exe'

      - name: Guardar el artefacto
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: maya-ik2-windows-x64-sm86
          path: dist/
          if-no-files-found: error
