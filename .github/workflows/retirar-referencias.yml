name: Retirar referencias del proyecto anterior
on:
  push:
    branches: [master]
    paths: ['.github/workflows/retirar-referencias.yml']
permissions:
  contents: write
jobs:
  retirar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retirar la rama y etiquetas verificadas
        run: |
          git push --atomic \
            --force-with-lease=refs/heads/phase5-ssd-ram-vram:9823c7ffca96b2a7facaeb23eb4107dd325b1327 \
            --force-with-lease=refs/tags/b11641:9c586f6be85b28572e80757179e799ed543e3e89 \
            --force-with-lease=refs/tags/b11647:4bd567f3aaeb5f115bdd6ed541d438340e058600 \
            origin :refs/heads/phase5-ssd-ram-vram :refs/tags/b11641 :refs/tags/b11647
