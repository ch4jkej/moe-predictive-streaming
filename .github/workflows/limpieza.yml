name: Eliminar artefactos anteriores
on:
  push:
    branches: [master]
    paths: ['.github/workflows/limpieza.yml']
  workflow_dispatch:
permissions:
  actions: write
jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Eliminar los 70 artefactos seleccionados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 12074610724 12074535259 12074485709 12074306066 12074291147 12074280823 12074261952 12074230481 12074226876 12074201837 12074155567 12074117187 12074042463 12074032625 12073977181 12073971763 12073952352 12073797512 12073792658 12073786855 12073777540 12073757572 12073652742 12073612296 12073492988 12073469122 12073414176 12073334375 12073328091 12073179017 12073173976 12073139121 12073083614 12073029768 12054674957 12012006616 12010876459 12010750351 12010640381 12010530925 12010008397 12009630486 12009358061 12009356490 12009326969 12009223276 12008359994 12008322053 12007134445 12006816779 12006690354 12006245852 12006210620 12006186533 12005899236 12005801571 12005787370 12005567532 12005452136 12005247698 12005247423 12005189389 12005151670 12005116477 12005071825 12004949323 12004469993 12004443899 12004214101 12004134009; do
